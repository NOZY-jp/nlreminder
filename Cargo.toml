[package]
name = "nlreminder"
version = "0.1.0"
edition = "2024"

[dependencies]
genai = "0.6.0-beta.15"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls"] }
rust-mcp-sdk = "0.9"
tokio = { version = "1", features = ["full"] }
color-eyre = "0.6"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
